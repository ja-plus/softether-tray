name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and submit (e.g. v0.4.1)
        required: true
      submit:
        description: Submit the package to Spark Store
        type: choice
        options: ["true", "false"]
        default: "true"

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Resolve release tag
        id: target
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
        run: |
          TAG="${EVENT_TAG:-${INPUT_TAG:-$REF_TAG}}"
          if [ -z "$TAG" ]; then
            echo "::error::No release tag provided"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify versions match the tag
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          TAG_VERSION="${TAG#v}"

          PKG_VERSION=$(node -p "require('./package.json').version")
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n1)

          if [ "$PKG_VERSION" != "$TAURI_VERSION" ] || [ "$PKG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Version mismatch: package.json=$PKG_VERSION tauri.conf.json=$TAURI_VERSION Cargo.toml=$CARGO_VERSION"
            exit 1
          fi
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $TAG does not match project version $PKG_VERSION"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            libssl-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            rpm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build packages
        run: npm run tauri build -- --bundles deb,rpm

      - name: Normalize package filenames
        id: package
        run: |
          DEB=$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)
          if [ -z "$DEB" ]; then
            echo "::error::No .deb produced"
            exit 1
          fi

          PKGNAME=$(dpkg-deb -f "$DEB" Package)
          VERSION=$(dpkg-deb -f "$DEB" Version)
          ARCH=$(dpkg-deb -f "$DEB" Architecture)

          # Spark Store already lists this app as soft-ether-tray; a different
          # Package name would be submitted as a new app instead of an update.
          if [ "$PKGNAME" != "soft-ether-tray" ]; then
            echo "::error::Unexpected package name: $PKGNAME"
            exit 1
          fi
          if [ "$ARCH" != "amd64" ]; then
            echo "::error::Unexpected architecture: $ARCH (this workflow only submits amd64)"
            exit 1
          fi

          ASSET="${PKGNAME}_${VERSION}_${ARCH}.deb"
          cp "$DEB" "$GITHUB_WORKSPACE/$ASSET"

          RPM=$(find src-tauri/target/release/bundle/rpm -maxdepth 1 -name '*.rpm' -print -quit)
          if [ -z "$RPM" ]; then
            echo "::error::No .rpm produced"
            exit 1
          fi

          RPMNAME=$(rpm -qp --qf '%{NAME}' "$RPM")
          RPMVER=$(rpm -qp --qf '%{VERSION}-%{RELEASE}' "$RPM")
          RPMARCH=$(rpm -qp --qf '%{ARCH}' "$RPM")
          if [ "$RPMNAME" != "soft-ether-tray" ]; then
            echo "::error::Unexpected RPM package name: $RPMNAME"
            exit 1
          fi
          if [ "$RPMARCH" != "x86_64" ]; then
            echo "::error::Unexpected RPM architecture: $RPMARCH (this workflow only builds x86_64)"
            exit 1
          fi

          RPM_ASSET="${RPMNAME}-${RPMVER}.${RPMARCH}.rpm"
          cp "$RPM" "$GITHUB_WORKSPACE/$RPM_ASSET"

          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "rpm_asset=$RPM_ASSET" >> "$GITHUB_OUTPUT"
          echo "rpm_name=$RPMNAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Smoke-test RPM install on Fedora
        env:
          RPM_ASSET: ${{ steps.package.outputs.rpm_asset }}
          RPM_NAME: ${{ steps.package.outputs.rpm_name }}
        run: |
          docker run --rm \
            -e RPM_ASSET -e RPM_NAME \
            -v "$GITHUB_WORKSPACE:/w:ro" \
            fedora:latest \
            bash -c 'dnf install -y "/w/$RPM_ASSET" && rpm -q "$RPM_NAME" && test -x /usr/bin/softether-tray && test -x /usr/lib/softether-tray/client/vpnclient && test -x /usr/libexec/softether-tray/softether-tray-net'

      - name: Ensure the GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --verify-tag --generate-notes --title "SoftEther Tray $TAG"
          fi

      - name: Upload packages to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
          ASSET: ${{ steps.package.outputs.asset }}
          RPM_ASSET: ${{ steps.package.outputs.rpm_asset }}
        run: |
          gh release upload "$TAG" "$ASSET" "$RPM_ASSET" --clobber

      - name: Check Spark Store version
        id: store
        env:
          STORE_URL: https://cdn.d.store.deepinos.org.cn/store/network/soft-ether-tray/app.json
          VERSION: ${{ steps.package.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SUBMIT: ${{ inputs.submit }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DISPATCH_SUBMIT" != "true" ]; then
            echo "should_submit=false" >> "$GITHUB_OUTPUT"
            echo "Submission disabled for this run."
            exit 0
          fi

          STORE_VERSION=$(wget -qO- --timeout=30 "$STORE_URL" 2>/dev/null | jq -r '.Version // empty' || true)

          echo "Spark Store version: ${STORE_VERSION:-unknown}, package version: $VERSION"

          if [ -n "$STORE_VERSION" ] && dpkg --compare-versions "$STORE_VERSION" ge "$VERSION"; then
            echo "should_submit=false" >> "$GITHUB_OUTPUT"
            echo "Store already has $STORE_VERSION; skipping submission."
          else
            echo "should_submit=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Submit package to Spark Store
        id: spark
        # The store submission is a distribution step, not a build gate: a
        # failure here must not hide that the packages were built and uploaded.
        continue-on-error: true
        if: steps.store.outputs.should_submit == 'true'
        env:
          # Official Spark Store submitter, pinned by version and SHA-256. The
          # auto mode reuses the existing store metadata and only replaces the
          # package, which is exactly what an already-listed app needs.
          SUBMITTER_URL: https://cdn.d.store.deepinos.org.cn/store/tools/spark-store-submitter/spark-store-submitter_1.5.7.5-20250703_amd64.deb
          SUBMITTER_SHA256: bb6a779a5bd95ad5d234f2924060cec847c4acf5061e0be61d9e961b6a3fd56c
          DEB_PATH: ${{ github.workspace }}/${{ steps.package.outputs.asset }}
        run: |
          set -euo pipefail

          test -f "$DEB_PATH"

          sudo apt-get install -y --no-install-recommends \
            libqt5core5a libqt5gui5 libqt5network5 libqt5widgets5 git

          # The submitter reads the git identity; without it submissions show
          # the auto-submit-ci fallback.
          git config --global user.name "ja-plus"
          git config --global user.email "601286825@qq.com"

          wget -qO /tmp/spark-submitter.deb "$SUBMITTER_URL"
          echo "$SUBMITTER_SHA256  /tmp/spark-submitter.deb" | sha256sum -c -
          dpkg-deb -x /tmp/spark-submitter.deb /tmp/spark-submitter

          set +e
          QT_QPA_PLATFORM=offscreen timeout 900 \
            /tmp/spark-submitter/opt/spark-store-submitter/bin/spark-store-submitter-cli \
            --auto --deb "$DEB_PATH" 2>&1 | tee /tmp/spark-submit.log
          STATUS=${PIPESTATUS[0]}
          set -e

          # Auto mode reports failure through the exit status (255) instead of
          # printing a message, so the status is the source of truth here.
          if [ "$STATUS" -ne 0 ]; then
            echo "::warning::Spark Store submission failed (exit code $STATUS); packages were still released."
            {
              echo "## Spark Store submission failed"
              echo ""
              echo "The automated submission exited with code \`$STATUS\`. The deb/rpm are already on the GitHub release."
              echo ""
              echo "Submit manually from a machine that can reach the store API:"
              echo ""
              echo '```bash'
              echo "spark-store-submitter-cli --auto --deb $ASSET"
              echo '```'
              if [ -s /tmp/spark-submit.log ]; then
                echo ""
                echo "Submitter log:"
                echo ""
                echo '```'
                cat /tmp/spark-submit.log
                echo '```'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Spark Store accepted the package for review."
